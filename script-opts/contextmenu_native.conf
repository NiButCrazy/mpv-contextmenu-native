# contextmenu_native 配置
#
# 作者：NiButCrazy
# 仓库：https://github.com/NiButCrazy/mpv-contextmenu-native
#
# 按键不由本脚本绑定，请在 input.conf 里配置，例如：
#   MBTN_RIGHT    script-message-to contextmenu_native show
# 之后按该键即可弹出菜单。

# 是否在菜单项右侧显示快捷键文本（如 space、f、m）。
# no：不显示（默认）；yes：显示菜单定义里各项的快捷键。
show_shortcut=no

# ---------------------------------------------------------------------------
# 滤镜 / 着色器条目
#
# 字段与 contextmenu_gui.conf 完全一致，可直接把旧配置中
# filter01..10 / shader01..10 段落复制到此处。
#
#   B = 显示在菜单上的文本
#   D = 选中后执行的命令
#   G = yes 时执行后重新弹出菜单（原生菜单无法回到子菜单，重开回到顶层）
#
# 留空则不显示该条目。
#
# 上游对照（菜单条目与配置字段的来源）：
#   https://github.com/A-Archives-and-Forks/MPV_lazy/tree/main/portable_config/scripts/contextmenu_gui
# ---------------------------------------------------------------------------
#filter01B=开/关 mvtools倍帧
#filter01D=vf toggle vapoursynth="~~/vs/MEMC_MVT_LQ.vpy"
#filter01G=no
